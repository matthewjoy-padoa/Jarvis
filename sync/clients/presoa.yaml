# Client synchronisé depuis Notion par la routine « deploy-hub-sync ».
slug: presoa
client: Presoa
software: Pulse + Uegar  # vues Recette du dashboard filtrées sur presoa_pulse et presoa-uegar
page_id: 3284976cdfac8157b91dcabc83e80b1c  # page « Clients en déploiement » (synchro directe par l'API)
recette_clients: [presoa_pulse, presoa-uegar]  # « Client » de la base Recette, en plus du lien au dashboard
orchestrator: [presoa-uegar, presoa-pulse]  # clés client de l'orchestrator : DAGs proposés dans l'onglet Injections
notion_url: https://app.notion.com/p/padoa/Dashboard-int-gration-Presoa-32d4976cdfac80cab1e5d0b46ecbc937
requetes:
  client: client-presoa.sql
  actions: actions-presoa.sql
  recette: recette-presoa.sql
  regles: regles-presoa.sql
# Synchro incrémentale : seules les lignes modifiées depuis la dernière synchro (paramètre ? = date).
deltas:
  actions: actions-delta-presoa.sql
  recette: recette-delta-presoa.sql
# Vérifiées en début de passage : inchangé → client sauté ; modifié → delta ; nombre de lignes changé → complet.
empreintes:
  actions: empreinte-actions-presoa.sql
  recette: recette-empreinte-presoa.sql
# Stacks Padoa du client, affichées en tête de fiche et sur la vue d'ensemble (lues à chaque page, sans synchro).
# env : prod, recette, formation… (court, affiché en petit) ; label : nom du bouton.
stacks: []
#  - {env: prod, label: Production, url: "https://…"}
#  - {env: recette, label: Snap recette, url: "https://…"}
