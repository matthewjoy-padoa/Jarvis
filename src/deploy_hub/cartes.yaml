  - id: kenora
    nom: Kenora
    role: Logiciel source
    rarete: commune
    stats: {Tables: 70, Mappings: 60, Volume: 50}
    pouvoir: Requête en double
    effet: Corrigée chez le client, à corriger aussi au niveau du logiciel.
  - id: medtra
    nom: Medtra
    role: Logiciel source
    rarete: commune
    stats: {Tables: 75, Mappings: 65, Volume: 55}
    pouvoir: Nouvelle version
