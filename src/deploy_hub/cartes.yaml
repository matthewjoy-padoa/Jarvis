# Cartes à collectionner de l'équipe (page Cartes de Jarvis) : familles « equipe » et « logiciel ».
# Les cartes « client » ne sont pas ici : Jarvis en bâtit une par client suivi, sur sa machine.
#
# Une carte :
#   id        ne change jamais (la collection de chacun s'y réfère) ; lettres, chiffres, tirets
#   nom       affiché en tête
#   role      ligne sous le nom
#   rarete    commune | rare | epique | legendaire
#   stats     trois au plus ; un entier de 0 à 100 est montré en jauge, un texte tel quel
#   pouvoir   nom du pouvoir, effet : ce qu'il fait
#   citation  en bas de carte
#   photo     fichier de src/deploy_hub/static/cartes/ (facultatif ; sans photo : les initiales)
#   emoji     à la place des initiales (facultatif)
#
# Ce dépôt est public : la carte d'une personne (nom, photo) n'y entre qu'avec son accord.
# Pour essayer une carte sans la publier : config/cartes.yaml, même format, hors git.

equipe:
  - id: jarvis
    nom: Jarvis
    role: Majordome de l'équipe Integration
    rarete: legendaire
    emoji: "🤵"
    stats: {Mémoire: 95, Patience: 100, Sommeil: 0}
    pouvoir: Tout au même endroit
    effet: Rassemble Notion, Airflow et l'orchestrator sur une seule page.
    citation: Très bien, je m'en occupe.
  - id: matthew
    nom: Matthew
    role: Intégration · reprise des données
    rarete: epique
    stats: {Mapping: 85, Délégation: 90, Sang-froid: 75}
    pouvoir: Une branche par sujet
    effet: Chaque idée part dans sa propre PR.
    citation: Simplifier ne veut pas dire supprimer.
  - id: agent
    nom: L'agent
    role: Renfort sur les retours de recette
    rarete: rare
    emoji: "🤖"
    stats: {Vitesse: 90, Autonomie: 70, Questions: 60}
    pouvoir: Worktree
    effet: Travaille à côté, sans toucher à ton clone.
    citation: J'ai une question avant de continuer.

