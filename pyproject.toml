[project]
name = "deploy-hub"
version = "0.1.0"
description = "Tableau de bord de déploiement client : injections, tâches, recettes, deadlines et actions"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deploy_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
